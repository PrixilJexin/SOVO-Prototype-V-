        import * as THREE from "three";

        import { GLTFLoader } from
            "three/addons/loaders/GLTFLoader.js";

        import { OrbitControls } from
            "three/addons/controls/OrbitControls.js";

        import { EffectComposer } from
            "three/addons/postprocessing/EffectComposer.js";


        import { RenderPass } from
            "three/addons/postprocessing/RenderPass.js";

        import { UnrealBloomPass } from
            "three/addons/postprocessing/UnrealBloomPass.js";




        // ============================================================
        // BASIC SETUP
        // ============================================================

        const scene = new THREE.Scene();

        // Background from saved settings
        scene.background = new THREE.Color("#3900a3");

        // Fog disabled
        scene.fog = null;


        const camera = new THREE.PerspectiveCamera(
            12.2,
            window.innerWidth / window.innerHeight,
            0.01,
            5000
        );

        camera.position.set(
            0.953565,
            -0.105253,
            0.383599
        );


        const renderer = new THREE.WebGLRenderer({
            antialias: true,     // supersample: true
            alpha: false,        // transparent: false
            powerPreference: "high-performance"  // powerPreference
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 1.5) // maxDevicePixelRatio: 1.5
        );

        renderer.outputColorSpace =
            THREE.SRGBColorSpace;

        renderer.toneMapping =
            THREE.ACESFilmicToneMapping;

        renderer.toneMappingExposure = 1;

        renderer.shadowMap.enabled = true;

        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;

        document.body.appendChild(
            renderer.domElement
        );


        // Camera locked — no mouse interaction
        const controls = new OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enabled = false;
        controls.enablePan = false;
        controls.enableRotate = false;

        controls.target.set(
            0.134665,
            0.007797,
            0.316149
        );

        controls.update();


        // ============================================================
        // LIGHTING
        // ============================================================

        const ambientLight =
            new THREE.AmbientLight(
                0xffffff,
                0
            );

        scene.add(ambientLight);


        const directionalLight =
            new THREE.DirectionalLight(
                0xffffff,
                0
            );

        directionalLight.position.set(
            -50,
            10,
            5
        );

        directionalLight.castShadow = true;

        // shadowTextureSize: 1024
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        directionalLight.shadow.camera.near = 0.01;
        directionalLight.shadow.camera.far = 500;
        directionalLight.shadow.bias = -0.0001;

        scene.add(directionalLight);


        const pointLight =
            new THREE.PointLight(
                0xffffff,
                0,
                100
            );

        pointLight.position.set(
            0,
            5,
            0
        );

        scene.add(pointLight);


        // ============================================================
        // BLOOM / GLOW
        // ============================================================

        const composer =
            new EffectComposer(renderer);


        const renderPass =
            new RenderPass(
                scene,
                camera
            );

        composer.addPass(
            renderPass
        );


        const bloomPass =
            new UnrealBloomPass(
                new THREE.Vector2(
                    window.innerWidth,
                    window.innerHeight
                ),
                1.25,
                0.69,
                0.9
            );

        composer.addPass(
            bloomPass
        );


        // ============================================================
        // MODEL
        // ============================================================

        let model = null;

        const modelGroup =
            new THREE.Group();

        scene.add(modelGroup);


        const loader =
            new GLTFLoader();


        // Change this only if your file has a different name/path.
        // Put test.html and bigcity.glb in the same folder.
        const MODEL_PATH =
            "./futurepunk.glb";


        loader.load(

            MODEL_PATH,

            (gltf) => {

                model = gltf.scene;

                modelGroup.add(model);

                document.getElementById(
                    "loading"
                ).style.display = "none";


                // Enable shadows, anisotropy, alphaTest per Sketchfab settings
                model.traverse(
                    (object) => {

                        if (!object.isMesh) return;

                        object.castShadow = true;
                        object.receiveShadow = true;

                        const mat = object.material;

                        if (!mat) return;

                        // epsilonAlpha: 0.00001
                        if (mat.transparent || mat.opacity < 1) {
                            mat.alphaTest = 0.00001;
                        }

                        mat.needsUpdate = true;

                        // anisotropy: true — apply max anisotropy to every texture slot
                        const maxAniso = renderer.capabilities.getMaxAnisotropy();

                        const texSlots = [
                            "map", "normalMap", "roughnessMap", "metalnessMap",
                            "aoMap", "emissiveMap", "alphaMap", "envMap"
                        ];

                        texSlots.forEach(slot => {

                            if (mat[slot]) {

                                mat[slot].anisotropy = maxAniso;
                                mat[slot].needsUpdate = true;
                            }
                        });
                    }
                );


                applyHardcodedSettings();

                setupAnimations(gltf.animations);

                console.log(
                    "Model loaded:",
                    model
                );
            },

            (progress) => {

                if (progress.total) {

                    const percent =
                        Math.round(
                            progress.loaded /
                            progress.total *
                            100
                        );

                    document.getElementById(
                        "loading"
                    ).textContent =
                        `Loading bigcity.glb... ${percent}%`;
                }
            },

            (error) => {

                console.error(error);

                    "loading"

            Failed to load bigcity.glb.<br><br>
            Run this folder through a local server.
        `;

            "b0207986-e62d-4214-8355-11d7eb9ed4b4": { color: 0, emissive: 16423148, emissiveIntensity: 10, roughness: 0, metalness: 0, opacity: 0.7271211829780785, transparent: true },
            "0f859df5-18a0-4227-9d31-5fb9e1c33d97": { color: 0, emissive: 16777215, emissiveIntensity: 10, roughness: 0, metalness: 0, opacity: 0.46483298070141693, transparent: true },
            "2e1fd91f-1147-4abb-8440-d46cd5ebd309": { color: 6700827, emissive: 0, emissiveIntensity: 1, roughness: 0, metalness: 0, opacity: 0.30163143261816083, transparent: true },
            "9f3c423d-41da-4f50-8c39-08e3b9b89133": { color: 0, emissive: 16777215, emissiveIntensity: 10, roughness: 0, metalness: 0, opacity: 0.5697482616120816, transparent: true },
            "f7d54a87-b6ee-46a2-83b6-9b3785f83d68": { color: 16765440, emissive: 11334, emissiveIntensity: 1, roughness: 0.07431499064505412, metalness: 1, opacity: 1, transparent: false }
        };

        // Texture overrides keyed by UUID
        const TEXTURE_OVERRIDES = {
            "2ca8fcbf-ad2a-44d0-81f3-e4192c8dc982": { repeatX: 3.0000000000000027, repeatY: 8.348110103205059 }
        };


        function applyHardcodedSettings() {

            if (!model) return;

            // Model transform
            model.scale.setScalar(10);
            model.position.set(0, 0, 0);
            model.rotation.set(0, 0, 0);

            // Apply material overrides
            model.traverse((object) => {

                if (!object.isMesh || !object.material) return;

                const mat = object.material;
                const o = MATERIAL_OVERRIDES[mat.uuid];

                if (!o) return;

                if (mat.color && o.color !== undefined)
                    mat.color.setHex(o.color);

                if (mat.emissive && o.emissive !== undefined)
                    mat.emissive.setHex(o.emissive);

                if (o.emissiveIntensity !== undefined)
                    mat.emissiveIntensity = o.emissiveIntensity;

                if (o.roughness !== undefined)
                    mat.roughness = o.roughness;

                if (o.metalness !== undefined)
                    mat.metalness = o.metalness;

                if (o.opacity !== undefined)
                    mat.opacity = o.opacity;

                if (o.transparent !== undefined)
                    mat.transparent = o.transparent;

                mat.needsUpdate = true;

                // Texture overrides
                if (mat.map) {

                    const t = TEXTURE_OVERRIDES[mat.uuid];

                    if (t) {

                        if (t.repeatX !== undefined) mat.map.repeat.x = t.repeatX;
                        if (t.repeatY !== undefined) mat.map.repeat.y = t.repeatY;

                        mat.map.needsUpdate = true;
                    }
                }
            });
        }





        // ============================================================
        // ANIMATION
        // ============================================================





        // ============================================================
        // ANIMATION
        // ============================================================

        let mixer = null;

        let clock =
            new THREE.Clock();


        let animationActions = [];







        // ============================================================
        // MODEL ANIMATION SETUP
        // ============================================================

        function setupAnimations(animations) {

            if (!animations || animations.length === 0)
                return;


            mixer =
                new THREE.AnimationMixer(
                    model
                );


            animations.forEach(
                clip => {

                    const action =
                        mixer.clipAction(
                            clip
                        );

                    action.play();

                    animationActions.push(
                        action
                    );
                }
            );
        }


        // ============================================================
        // MOUSE PARALLAX — camera gently follows cursor
        // ============================================================

        // ── Parallax config ────────────────────────────────────────────
        // BASE_LOOK is where the camera rests when cursor is centred
        const BASE_LOOK = new THREE.Vector3(0.134665, 0.007797, 0.316149);

        // How far the look-at drifts in camera-space units
        // (camera right/up vectors, so drift is always perfectly horizontal/vertical)
        const PARALLAX_H = 0.03;   // left / right swing
        const PARALLAX_V = 0.02;  // up   / down  swing
        const PARALLAX_EASE = 0.045;  // lerp speed (lower = more inertia)

        // Smoothed look-at Vector3 (starts at rest position)
        let currentLook = BASE_LOOK.clone();

        // Reusable scratch vectors — allocated once, not per-frame
        const _camRight = new THREE.Vector3();
        const _camUp = new THREE.Vector3();
        const _camFwd = new THREE.Vector3();
        const _targetLook = new THREE.Vector3();

        // Mobile detection — must be before the event listeners below
        const isMobile = ("ontouchstart" in window) ||
            (navigator.maxTouchPoints > 0) ||
            window.matchMedia("(pointer: coarse)").matches;

        // Raw normalised mouse position (-1 to +1)
        let rawMouseX = 0;
        let rawMouseY = 0;


        window.addEventListener("mousemove", (e) => {
            if (isMobile) return; // gyro handles mobile
            rawMouseX = (e.clientX / window.innerWidth) * 2 - 1;
            rawMouseY = (e.clientY / window.innerHeight) * 2 - 1;
        });

        // Reset smoothly when mouse leaves the window
        window.addEventListener("mouseleave", () => {
            if (isMobile) return;
            rawMouseX = 0;
            rawMouseY = 0;
        });

        // Listen for parent messages for iframe-based parallax
        window.addEventListener("message", (e) => {
            if (isMobile) return;
            if (e.data && e.data.type === "mousemove") {
                rawMouseX = e.data.x;
                rawMouseY = e.data.y;
            } else if (e.data && e.data.type === "mouseleave") {
                rawMouseX = 0;
                rawMouseY = 0;
            }
        });




        if (isMobile) {

            // Zoom camera in 50% closer on mobile for better rotation range
            camera.position.set(
                0.544,
                -0.049,
                0.350
            );

            // Portrait screens need more vertical coverage
            camera.fov = 16;
            camera.updateProjectionMatrix();
        }


        // ── Gyroscope calibration ─────────────────────────────────────
        // Stores the "resting" angle so current phone angle = centre
        let gyroBaseGamma = null;
        let gyroBaseBeta = null;

        function onGyro(event) {

            let gamma = event.gamma ?? 0; // left/right tilt  -90 → +90
            let beta = event.beta ?? 0; // forward/back tilt -180 → +180

            // Auto-calibrate on first reading
            if (gyroBaseGamma === null) {
                gyroBaseGamma = gamma;
                gyroBaseBeta = beta;
                return;
            }

            // Delta from calibrated centre, clamped to ±30°
            const dG = Math.max(-30, Math.min(30, gamma - gyroBaseGamma));
            const dB = Math.max(-30, Math.min(30, beta - gyroBaseBeta));

            // Map ±30° → ±1 and feed into the shared parallax variables
            rawMouseX = dG / 30;
            rawMouseY = -dB / 30; // negate: tilt forward = look up
        }


        // ── iOS 13+ requires a user-gesture permission request ────────
        if (isMobile) {

            if (
                typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function"
            ) {
                // iOS — show permission button
                const gyroBtn = document.createElement("button");
                gyroBtn.id = "gyro-btn";
                gyroBtn.textContent = "🔄  Enable Gyroscope";
                gyroBtn.style.cssText = `
                    position: fixed;
                    bottom: 32px;
                    left: 50%;
                    transform: translateX(-50%);
                    z-index: 999;
                    padding: 13px 28px;
                    background: rgba(255,255,255,0.12);
                    color: #fff;
                    border: 1px solid rgba(255,255,255,0.25);
                    border-radius: 999px;
                    font-size: 15px;
                    font-family: inherit;
                    letter-spacing: 0.03em;
                    backdrop-filter: blur(14px);
                    -webkit-backdrop-filter: blur(14px);
                    cursor: pointer;
                    box-shadow: 0 4px 24px rgba(0,0,0,0.35);
                `;
                document.body.appendChild(gyroBtn);

                gyroBtn.addEventListener("click", () => {

                    DeviceOrientationEvent.requestPermission()
                        .then((state) => {
                            if (state === "granted") {
                                window.addEventListener(
                                    "deviceorientation",
                                    onGyro
                                );
                                gyroBtn.style.opacity = "0";
                                gyroBtn.style.transition = "opacity 0.5s";
                                setTimeout(() => gyroBtn.remove(), 600);
                            }
                        })
                        .catch(console.error);
                });

            } else {

                // Android + other browsers — no permission needed
                window.addEventListener("deviceorientation", onGyro);
            }
        }




        // ============================================================
        // RENDER LOOP
        // ============================================================

        function animate() {

            requestAnimationFrame(
                animate
            );


            const delta =
                clock.getDelta();


            // GLB animations — always playing at speed 0.2
            if (mixer) {

                mixer.update(delta * 0.2);
            }


            // Camera-space parallax — offsets look-at along camera's own
            // right and up axes so movement is ALWAYS straight (no diagonal)
            camera.getWorldDirection(_camFwd);
            _camRight.crossVectors(_camFwd, camera.up).normalize();
            _camUp.crossVectors(_camRight, _camFwd).normalize();

            _targetLook
                .copy(BASE_LOOK)
                .addScaledVector(_camRight, rawMouseX * PARALLAX_H)
                .addScaledVector(_camUp, -rawMouseY * PARALLAX_V);

            currentLook.lerp(_targetLook, PARALLAX_EASE);
            camera.lookAt(currentLook);

            composer.render();
        }


        animate();


        // ============================================================
        // WINDOW RESIZE
        // ============================================================

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );


                composer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );




    </script>
